<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SweetDelight - Your Cart</title>
  <style>
    body {font-family:'Segoe UI', sans-serif; background:#fff0f5; color:#333; margin:0;}
    header {background:#ff69b4; padding:15px 30px; display:flex; justify-content:space-between; align-items:center; color:white;}
    header h1 {font-size:24px;}
    nav a {margin-left:20px; font-weight:bold; color:white; text-decoration:none;}

    .section {padding:40px 20px; max-width:900px; margin:auto;}
    h2 {color:#ff1493; margin-bottom:20px; text-align:center;}

    table {width:100%; border-collapse:collapse; margin-top:20px; background:white; border-radius:10px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.1);}
    table th, table td {padding:15px; text-align:center; border-bottom:1px solid #ddd;}
    table th {background:#ff69b4; color:white;}

    .btn {padding:6px 12px; border:none; cursor:pointer; border-radius:5px; font-weight:bold;}
    .btn-remove {background:#dc3545; color:white;}
    .btn-checkout {margin-top:20px; display:block; background:#28a745; color:white; padding:12px; border-radius:5px; font-size:16px; text-align:center;}

    .qty-btn {padding:5px 10px; border:none; border-radius:5px; font-weight:bold; cursor:pointer;}
    .qty-minus {background:#ff4d4d; color:white;}
    .qty-plus {background:#28a745; color:white;}
  </style>
</head>
<body>
  <header>
    <h1>🎂 SweetDelight</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="cart.html">Cart 🛒(<span id="cart-count">0</span>)</a>
    </nav>
  </header>

  <div class="section">
    <h2>Your Shopping Cart</h2>
    <table id="cart-table">
      <thead>
        <tr>
          <th>Product</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Total</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <h3 id="grand-total">Grand Total: ₹0</h3>
    <a href="login.html" class="btn-checkout">Proceed to Checkout</a>
  </div>

  <script>
    function getCart() {
      return JSON.parse(localStorage.getItem("cart")) || [];
    }

    function saveCart(cart) {
      localStorage.setItem("cart", JSON.stringify(cart));
      updateCartCount();
    }

    function updateCart() {
      let cart = getCart();
      let tbody = document.querySelector("#cart-table tbody");
      tbody.innerHTML = "";
      let grandTotal = 0;

      cart.forEach((item, index) => {
        let total = item.price * item.qty;
        grandTotal += total;
        tbody.innerHTML += `
          <tr>
            <td>${item.name}</td>
            <td>₹${item.price}</td>
            <td>
              <button class="qty-btn qty-minus" onclick="changeQty(${index}, -1)">-</button>
              ${item.qty}
              <button class="qty-btn qty-plus" onclick="changeQty(${index}, 1)">+</button>
            </td>
            <td>₹${total}</td>
            <td><button class="btn btn-remove" onclick="removeItem(${index})">Remove</button></td>
          </tr>
        `;
      });

      document.getElementById("grand-total").textContent = "Grand Total: ₹" + grandTotal;
    }

    function changeQty(index, delta) {
      let cart = getCart();
      cart[index].qty += delta;
      if (cart[index].qty <= 0) {
        cart.splice(index, 1); // qty 0 → remove item
      }
      saveCart(cart);
      updateCart();
    }

    function removeItem(index) {
      let cart = getCart();
      cart.splice(index, 1);
      saveCart(cart);
      updateCart();
    }

    function updateCartCount() {
      let cart = getCart();
      let count = cart.reduce((sum,item)=> sum+item.qty, 0);
      document.getElementById("cart-count").textContent = count;
    }

    updateCartCount();
    updateCart();
  </script>
</body>
</html>

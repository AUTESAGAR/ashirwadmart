<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us - SweetDelight</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* Reset and Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #fffafc;
      color: #333;
    }

    header {
      background-color: #ff69b4;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
    }

    header h1 {
      font-size: 24px;
    }

    nav a {
      margin-left: 20px;
      font-weight: bold;
      color: white;
      text-decoration: none;
    }

    .contact-container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .contact-form h2,
    .contact-info h2 {
      color: #ff1493;
      margin-bottom: 20px;
    }

    form label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    form input,
    form textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    form textarea {
      resize: vertical;
      height: 100px;
    }

    .btn {
      background-color: #ff1493;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #d63384;
    }

    .contact-info p {
      margin-bottom: 12px;
      line-height: 1.5;
    }

    iframe {
      width: 100%;
      height: 200px;
      border: none;
      border-radius: 10px;
      margin-top: 10px;
    }

    footer {
      background-color: #ff69b4;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }

    @media (max-width: 768px) {
      .contact-container {
        grid-template-columns: 1fr;
      }

      header {
        flex-direction: column;
        text-align: center;
      }

      nav {
        margin-top: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <h1>🎂 SweetDelight</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="order.html">Order</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="cart.html">Cart</a>
    </nav>
  </header>

  <!-- Contact Section -->
  <section class="contact-container">
    <!-- Contact Form -->
    <div class="contact-form">
      <h2>Send Us a Message</h2>
      <form>
        <label for="name">Your Name *</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Your Email *</label>
        <input type="email" id="email" name="email" required>

        <label for="subject">Subject *</label>
        <input type="text" id="subject" name="subject" required>

        <label for="message">Your Message *</label>
        <textarea id="message" name="message" required></textarea>

        <button type="submit" class="btn">Send Message</button>
      </form>
    </div>

    <!-- Contact Info -->
    <div class="contact-info">
      <h2>Contact Info</h2>
      <p><strong>SweetDelight Cakes</strong></p>
      <p>123, Pink Lane, Cake City, Mumbai, MH 400001</p>
      <p>📞 Phone: +91 98765 43210</p>
      <p>📧 Email: support@sweetdelight.in</p>

      <h3>Our Location</h3>
      <!-- Optional: Replace the `src` URL with your real location -->
      <iframe src="https://maps.google.com/maps?q=Gateway%20of%20India%20Mumbai&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 SweetDelight Cakes | Designed by Sagar</p>
  </footer>

</body>
</html>

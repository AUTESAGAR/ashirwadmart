<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout - SweetDelight</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff0f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .checkout-box {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      text-align: center;
    }
    h2 {
      margin-bottom: 20px;
      color: #d63384;
    }
    .btn {
      background-color: #ff1493;
      color: white;
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .btn:hover {
      background-color: #c2185b;
    }
  </style>
</head>
<body>

  <div class="checkout-box">
    <h2>Pay for Your Cake Order</h2>
    <p>Amount: ₹500</p>
    <button class="btn" id="payBtn">Pay Now</button>
  </div>

  <script>
    document.getElementById("payBtn").onclick = function (e) {
      var options = {
        key: "rzp_test_yourkeyhere", // Replace with your Razorpay Test Key
        amount: 50000, // Amount in paise (₹500)
        currency: "INR",
        name: "SweetDelight Cakes",
        description: "Cake Order Payment",
        image: "https://yourdomain.com/logo.png", // Optional logo
        handler: function (response) {
          alert("Payment Successful!\nPayment ID: " + response.razorpay_payment_id);
          // TODO: Send payment ID to your backend for verification
        },
        prefill: {
          name: "Customer Name",
          email: "customer@example.com",
          contact: "9123456789"
        },
        notes: {
          order_id: "ORDER_1234"
        },
        theme: {
          color: "#ff69b4"
        }
      };
      var rzp = new Razorpay(options);
      rzp.open();
      e.preventDefault();
    }
  </script>

</body>
</html>
